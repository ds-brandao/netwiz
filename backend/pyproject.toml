[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",   # line too long
    "E722",   # bare except (pre-existing)
    "E402",   # module level import not at top (required for test setup)
    "E713",   # not in test (pre-existing)
    "F401",   # unused imports (pre-existing)
    "F541",   # f-string without placeholders (pre-existing debug prints)
    "F811",   # redefinition (pre-existing)
    "F821",   # undefined name (pre-existing)
    "F841",   # unused variable (pre-existing)
]
exclude = ["test_*.py", "debug_*.py", "reset_*.py", "migrate_*.py"]
